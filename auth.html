<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>VSW account security</title>
<style>
:root{color-scheme:dark;font:1rem/1.6 system-ui,sans-serif;background:#0b0817;color:#f4efff}
body{margin:0;min-height:100dvh;display:grid;place-items:center}
main{box-sizing:border-box;width:min(34rem,calc(100% - 2rem));padding:clamp(1.25rem,5vw,2.5rem);border:1px solid #564479;border-radius:1.25rem;background:#171025}
.brand{font-size:.8rem;font-weight:700;letter-spacing:.13em;color:#b6ec93}
h1{line-height:1.15;font-size:clamp(1.7rem,5vw,2.3rem)}p{color:#dbd0ef}
a{display:inline-flex;min-height:48px;align-items:center;padding:0 1.15rem;border-radius:.75rem;background:#c2a4ff;color:#140a26;font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid #b6ec93;outline-offset:4px}
a[hidden]{display:none}
</style>
</head>
<body><main>
<p class="brand">VIRTUAL STEERING WHEEL</p>
<h1 id="title">Continue in VSW</h1>
<p id="status">Open the email on the Android phone where you made the request.</p>
<a id="open-app" hidden>Open VSW</a>
<p>You can also enter the code from your email in the app.</p>
</main>
<script>
(() => {
  const fragment = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  const hash = fragment.get("token_hash") || "";
  const titles = new Map([
    ["signup", "Confirm your email"],
    ["recovery", "Reset your password"],
    ["email_change", "Confirm your new email"]
  ]);
  const flow = fragment.get("type");
  const status = document.getElementById("status");
  try {
    const redirect = new URL(fragment.get("redirect") || "");
    const state = redirect.searchParams.get("vsw_state") || "";
    if (!titles.has(flow) || !/^[A-Za-z0-9_-]{20,256}$/.test(hash) ||
        redirect.protocol !== "com.auram.virtualswpad.guide:" || redirect.host !== "auth" ||
        redirect.pathname !== "/callback" || redirect.username || redirect.password ||
        redirect.searchParams.get("type") !== flow || !/^[A-Za-z0-9_-]{43}$/.test(state)) {
      throw new Error("Invalid email link");
    }
    const query = new URLSearchParams({type: flow, vsw_state: state, email_token_hash: hash});
    const openApp = document.getElementById("open-app");
    openApp.href = "intent://auth/callback?" + query.toString() +
      "#Intent;scheme=com.auram.virtualswpad.guide;package=com.auram.virtualswpad.black;end";
    document.getElementById("title").textContent = titles.get(flow);
    status.textContent = "Tap Open VSW to verify this request on the phone that started it.";
    openApp.hidden = false;
  } catch {
    status.textContent = "This link is incomplete. Enter the code from your email in VSW, or request a new message.";
  }
})();
</script>
</body>
</html>
